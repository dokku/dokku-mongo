---
services:
  mongo:
    image: "{{ .Image }}:{{ .ImageVersion }}"

    # the image's entrypoint creates the admin account from these on first boot
    environment:
      MONGO_INITDB_DATABASE: "{{ .Database }}"
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: "{{ .Secret.root_password }}"

    volumes:
      - type: bind
        source: "{{ .HostRoot }}/config"
        target: /etc/mongo
      - type: bind
        source: "{{ .HostRoot }}/data"
        target: /data/db
      # a config server keeps its data here rather than in /data/db. A
      # standalone service writes nothing to it, but the image declares it a
      # volume, so it is bound rather than left for docker to make an anonymous
      # volume of
      - type: bind
        source: "{{ .HostRoot }}/configdb"
        target: /data/configdb
      - type: bind
        source: "{{ .HostRoot }}/initdb"
        target: /docker-entrypoint-initdb.d

    configs:
      - source: create_service_user
        target: /docker-entrypoint-initdb.d/create-service-user.js

    ports:
      - name: native
        target: 27017
        primary: true
      - name: shard
        target: 27018
      - name: config
        target: 27019
      - name: status
        target: 28017

configs:
  # the service account is created by the image's own initialisation rather than
  # by a command run after the container is up. It runs before the server is
  # ever reachable, so there is no window where a service is ready and the
  # account a linked app uses does not exist yet.
  create_service_user:
    content: |
      if (db.getUser({{ .ServiceName | printf "%q" }}) == null) {
        db.createUser({
          user: {{ .ServiceName | printf "%q" }},
          pwd: {{ .Secret.password | printf "%q" }},
          roles: [{role: "readWrite", db: {{ .Database | printf "%q" }}}]
        });
      }

x-dokku:
  plugin: mongo
  title: MongoDB
  scheme: mongodb
  alias: MONGO

  # an account authenticates against the database it was made in, which for
  # every account is the service's own, so a url addressing another says so
  dsn: "{{ .Scheme }}://{{ .Username }}:{{ .Password }}@{{ .Host }}:{{ .Port.native }}/{{ .Database }}{{ if ne .Database .DefaultDatabase }}?authSource={{ .DefaultDatabase }}{{ end }}"
  wait: native

  # the databases and users a service holds beside its own, made as the admin
  # account. A user is made in the service's own database, as the service's
  # account is, so a url names it as the database to authenticate against
  # whichever database it addresses. Each is given readWrite on every database
  # the service holds, and on each one made later. Mongo makes a database the
  # first time it is written to, so making one only grants it. The names reach
  # mongosh through its environment rather than its script, so nothing in one
  # is read as code.
  databases:
    create:
      exec:
        - sh
        - -c
        - |
          set -e
          mongosh --quiet -u admin -p "$ROOT_PASSWORD" --authenticationDatabase admin --eval "$1" admin >/dev/null
        - dokku-mongo-create-database
        - |
          const auth = db.getSiblingDB(process.env.AUTH_DATABASE);
          for (const user of process.env.USERS.split(" ").filter(Boolean)) {
            auth.grantRolesToUser(user, [{role: "readWrite", db: process.env.DATABASE}]);
          }
      env:
        ROOT_PASSWORD: "{{ .Secret.root_password }}"
        AUTH_DATABASE: "{{ .DefaultDatabase }}"
        DATABASE: "{{ .Args.database }}"
        USERS: "{{ .Args.users }}"
    destroy:
      exec:
        - sh
        - -c
        - |
          set -e
          mongosh --quiet -u admin -p "$ROOT_PASSWORD" --authenticationDatabase admin --eval "$1" admin >/dev/null
        - dokku-mongo-destroy-database
        - |
          if (db.getSiblingDB(process.env.DATABASE).dropDatabase().ok !== 1) quit(1);
          const auth = db.getSiblingDB(process.env.AUTH_DATABASE);
          for (const user of process.env.USERS.split(" ").filter(Boolean)) {
            auth.revokeRolesFromUser(user, [{role: "readWrite", db: process.env.DATABASE}]);
          }
      env:
        ROOT_PASSWORD: "{{ .Secret.root_password }}"
        AUTH_DATABASE: "{{ .DefaultDatabase }}"
        DATABASE: "{{ .Args.database }}"
        USERS: "{{ .Args.users }}"

  users:
    default: "{{ .ServiceName }}"
    secret: password
    reserved: [admin]
    create:
      exec:
        - sh
        - -c
        - |
          set -e
          mongosh --quiet -u admin -p "$ROOT_PASSWORD" --authenticationDatabase admin --eval "$1" admin >/dev/null
        - dokku-mongo-create-user
        - |
          db.getSiblingDB(process.env.AUTH_DATABASE).createUser({
            user: process.env.USER_NAME,
            pwd: process.env.NEW_PASSWORD,
            roles: process.env.DATABASES.split(" ").filter(Boolean).map((database) => ({role: "readWrite", db: database})),
          });
      env:
        ROOT_PASSWORD: "{{ .Secret.root_password }}"
        AUTH_DATABASE: "{{ .DefaultDatabase }}"
        USER_NAME: "{{ .Args.user }}"
        DATABASES: "{{ .Args.databases }}"
        NEW_PASSWORD: "{{ .NewSecret }}"
    destroy:
      exec:
        - sh
        - -c
        - |
          set -e
          mongosh --quiet -u admin -p "$ROOT_PASSWORD" --authenticationDatabase admin --eval "$1" admin >/dev/null
        - dokku-mongo-destroy-user
        - |
          if (!db.getSiblingDB(process.env.AUTH_DATABASE).dropUser(process.env.USER_NAME)) quit(1);
      env:
        ROOT_PASSWORD: "{{ .Secret.root_password }}"
        AUTH_DATABASE: "{{ .DefaultDatabase }}"
        USER_NAME: "{{ .Args.user }}"
    change:
      exec:
        - sh
        - -c
        - |
          set -e
          mongosh --quiet -u admin -p "$ROOT_PASSWORD" --authenticationDatabase admin --eval "$1" admin >/dev/null
        - dokku-mongo-change-user-password
        - |
          db.getSiblingDB(process.env.AUTH_DATABASE).changeUserPassword(process.env.USER_NAME, process.env.NEW_PASSWORD);
      env:
        ROOT_PASSWORD: "{{ .Secret.root_password }}"
        AUTH_DATABASE: "{{ .DefaultDatabase }}"
        USER_NAME: "{{ .Args.user }}"
        NEW_PASSWORD: "{{ .NewSecret }}"


  secrets:
    password:
      file: PASSWORD
      length: 16
      env: SERVICE_PASSWORD

      # the account is made by the seeded script on first boot, so its new
      # password is given to it by the server, as the admin account. The
      # script is then written over with the new password as well, so that a
      # data directory made again does not bring the old one back. It is
      # written over rather than replaced, so it keeps its owner and mode.
      change:
        user: "0"
        exec:
          - sh
          - -c
          - |
            set -e
            mongosh --quiet -u admin -p "$ROOT_PASSWORD" --authenticationDatabase admin \
              --eval 'db.getSiblingDB(process.env.DATABASE).changeUserPassword(process.env.SERVICE_USER, process.env.NEW_PASSWORD)' \
              admin >/dev/null
            script="$1"
            if [ -f "$script" ]; then
              updated="$(while IFS= read -r line || [ -n "$line" ]; do
                case "$line" in
                  *pwd:*) printf '%s\n' "${line%%pwd:*}pwd: \"$NEW_PASSWORD\"," ;;
                  *) printf '%s\n' "$line" ;;
                esac
              done < "$script")"
              printf '%s\n' "$updated" > "$script"
            fi
          - dokku-mongo-change-password
          - "{{ .Target.initdb }}/create-service-user.js"
        env:
          ROOT_PASSWORD: "{{ .Secret.root_password }}"
          DATABASE: "{{ .Database }}"
          SERVICE_USER: "{{ .ServiceName }}"
          NEW_PASSWORD: "{{ .NewSecret }}"

    root_password:
      file: ROOTPASSWORD
      length: 16
      env: SERVICE_ROOT_PASSWORD

      # the image only reads MONGO_INITDB_ROOT_PASSWORD when it makes the data
      # directory, so the admin account changes its own password
      change:
        exec:
          - mongosh
          - --quiet
          - -u
          - admin
          - -p
          - "{{ .Secret.root_password }}"
          - --authenticationDatabase
          - admin
          - --eval
          - db.getSiblingDB("admin").changeUserPassword("admin", process.env.NEW_PASSWORD)
          - admin
        env:
          NEW_PASSWORD: "{{ .NewSecret }}"

  # mongo's own, which the tool knows nothing about beyond how to run them
  custom_commands:
    connect-admin:
      # rendered against the same data the tool's own descriptions are, so a
      # datastore's command reads the same way as the rest
      description: connect to the {{.Title}} service as the admin user
      # one line per element, as the tool's own documentation is written: the
      # first line describes the command, a line starting with dokku becomes a
      # shell block, and the rest is prose
      documentation: |
        connect to the {{.Title}} service as the admin user
        > NOTE: the admin user acts across every database, where the service user is limited to the one the service was created with
        dokku {{.Command "connect-admin"}} lollipop
      exec:
        - mongosh
        - -u
        - admin
        - -p
        - "{{ .Secret.root_password }}"
        - --authenticationDatabase
        - admin
        - "{{ .ServiceName }}"
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8

  commands:
    connect:
      exec:
        - mongosh
        - -u
        - "{{ .Username }}"
        - -p
        - "{{ .Password }}"
        - --authenticationDatabase
        - "{{ .DefaultDatabase }}"
        - "{{ .Database }}"
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8

    export:
      extra_args: true
      exec:
        - mongodump
        - -d
        - "{{ .Database }}"
        - -u
        - "{{ .ServiceName }}"
        - -p
        - "{{ .Secret.password }}"
        - --authenticationDatabase
        - "{{ .DefaultDatabase }}"
        - --quiet
        - --gzip
        - --archive

      # every database, as the admin account reset uses, since the service's
      # own account can only read the database it was made in. mongodump has
      # no way to leave a database out of a dump of all of them, so the ones
      # the server keeps for itself are left out when it is loaded instead.
      all_databases:
        extra_args: true
        exec:
          - mongodump
          - -u
          - admin
          - -p
          - "{{ .Secret.root_password }}"
          - --authenticationDatabase
          - admin
          - --quiet
          - --gzip
          - --archive

    import:
      extra_args: true
      stdin: true
      exec:
        - mongorestore
        - -u
        - "{{ .ServiceName }}"
        - -p
        - "{{ .Secret.password }}"
        - --authenticationDatabase
        - "{{ .DefaultDatabase }}"
        - --gzip
        - --archive
        # without this a restore inserts alongside what is already there and
        # skips anything that collides, so importing into a service that has
        # data leaves the old data in place. An import replaces.
        - --drop
        # the dump records the database it came from, so a restore has to be
        # told to put it back under this service's name. These are mongo's own
        # placeholders rather than anything this tool expands.
        - --nsFrom
        - $db$.$coll$
        - --nsTo
        - "{{ .Database }}.$coll$"

      # each database goes back under the name it was dumped from. The admin
      # database holds every account, the service's included, and loading it
      # would set their passwords to the ones the dump was taken with, so it is
      # left out along with the server's sharding and replication state.
      all_databases:
        extra_args: true
        stdin: true
        exec:
          - mongorestore
          - -u
          - admin
          - -p
          - "{{ .Secret.root_password }}"
          - --authenticationDatabase
          - admin
          - --gzip
          - --archive
          - --drop
          - --nsExclude
          - admin.*
          - --nsExclude
          - config.*
          - --nsExclude
          - local.*

    # the database is dropped, collections, views and indexes with it, and comes
    # back on the next write. Users are kept in the admin database rather than
    # in the one they were created in, so the account a linked app connects as
    # survives the drop. As the admin account, since the service account's
    # readWrite does not reach as far as dropping its own database.
    reset:
      exec:
        - mongosh
        - --quiet
        - -u
        - admin
        - -p
        - "{{ .Secret.root_password }}"
        - --authenticationDatabase
        - admin
        - "{{ .Database }}"
        - --eval
        - "if (db.dropDatabase().ok !== 1) quit(1)"
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8

  # the databases the server keeps its users, its sharding and its replication
  # in. A service named after one would hand its app one of them
  reserved_names: [admin, config, local]
